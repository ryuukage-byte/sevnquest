<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daftar Fitur SevnQuest</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1c1b19;--mut:#6b675f;--line:#e2dfd6;--acc:#b3261e;--acc2:#1f6f5c;--chip:#efece3}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#1f1e1b;--ink:#efece3;--mut:#9d988c;--line:#33312c;--acc:#ff7a6e;--acc2:#5fc9ae;--chip:#2a2824}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:26px;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line);display:grid;gap:8px}
.bar input,.bar select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 180px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:13px}
.tabs button.on{background:var(--ink);color:var(--bg)}
h2{font-size:18px;margin:28px 0 4px}
.gdesc{color:var(--mut);margin:0 0 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}
.card h3{margin:0 0 6px;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mut);font-weight:500}
.tag.p{color:#a15c00}.tag.u{color:var(--acc)}
dl{margin:8px 0;display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:14px}
dt{color:var(--mut)}dd{margin:0}
ol{margin:0;padding-left:18px}
code{background:var(--chip);padding:1px 5px;border-radius:5px;font-size:12px;word-break:break-all}
.btn{margin-top:8px;border:0;background:var(--acc);color:#fff;padding:9px 16px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.ok{background:var(--acc2)}
.btn.ghost{background:var(--chip);color:var(--ink);margin-left:6px}
details{margin-top:8px}summary{cursor:pointer;color:var(--mut);font-size:13px}
pre{white-space:pre-wrap;background:var(--chip);padding:10px;border-radius:8px;font-size:13px;margin:6px 0 0}
.cnt{color:var(--mut);font-size:13px}
@media(max-width:520px){dl{grid-template-columns:1fr}dt{margin-top:4px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Daftar Fitur SevnQuest</h1>
<p class="sub">Nihongo Quest RPG — fitur lengkap beserta lokasi, fungsi, cara pakai, dan detail teknis. Klik <b>Buat Konten</b> untuk menyalin prompt siap tempel ke AI.</p>
<div class="bar">
  <input id="q" type="search" placeholder="Cari fitur, mis. 'tower', 'kanji', 'SRS'…">
  <div class="row">
    <select id="fmt">
      <option value="skrip video pendek (TikTok/Reels/Shorts, 30–45 detik)">Format: Skrip video pendek</option>
      <option value="caption Instagram/Threads yang menarik">Format: Caption sosmed</option>
      <option value="thread X/Twitter 5–7 tweet">Format: Thread</option>
      <option value="artikel blog singkat 300 kata">Format: Artikel blog</option>
      <option value="skrip tutorial langkah demi langkah untuk YouTube">Format: Tutorial YouTube</option>
    </select>
    <select id="tone">
      <option value="santai dan ramah">Gaya: Santai</option>
      <option value="semangat dan memotivasi">Gaya: Semangat</option>
      <option value="informatif dan jelas">Gaya: Informatif</option>
      <option value="lucu dan relatable">Gaya: Lucu</option>
    </select>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="cnt" id="cnt"></div>
</div>
<div id="list"></div>
</div>

{g:"Mesin & Alat Bantu",d:"Fitur pendukung lintas modul.",i:[
{n:"Audio TTS & Efek Suara",w:["Buka SevnQuest","ikon speaker di detail kata/soal"],f:"mendengar pelafalan kata Jepang",s:["Buka materi di Library","Ketuk ikon speaker"],d:"Web Speech TTS."},
{n:"Furigana & Input IME Jepang",w:["Buka SevnQuest","kolom pencarian/jawaban"],f:"mengetik romaji otomatis menjadi kana, dan menampilkan furigana di atas kanji",s:["Ketik romaji di kolom input","Atur furigana di Menu"],d:"wanakana, utils/furiganaUtils, imeEngine."}]}
];

const $=s=>document.querySelector(s);
const st=(x)=>x==="P"?'<span class="tag p">Parsial</span>':'';
function prompt(f,g){
  const fmt=$('#fmt').value,tone=$('#tone').value;
  const loc=f.w.join(" → ");
  const steps=f.s.map((x,i)=>`${i+1}. ${x}`).join("\n");
  return `Buatkan ${fmt} dengan gaya ${tone}, dalam bahasa Indonesia, untuk mempromosikan aplikasi belajar bahasa Jepang "SevnQuest" (Nihongo Quest RPG).

Topik: fitur "${f.n}" (kategori ${g}).

Gambaran isi konten: "Kamu bisa menggunakan fitur ${f.n} di SevnQuest untuk ${f.f}. Caranya, ${f.s.map((x,i)=>(i?`lalu `:'')+x.charAt(0).toLowerCase()+x.slice(1)).join(", ")}."

Informasi fitur:
- Lokasi di aplikasi: ${loc}
- Fungsi: ${f.f}
- Cara pakai:
${steps}
- Detail tambahan: ${f.d}

Ketentuan:
- Buka dengan hook yang menarik di kalimat pertama.
- Jelaskan lokasi fitur dan langkahnya dengan jelas agar mudah diikuti.
- Hanya pakai informasi di atas, jangan mengarang fitur atau angka lain.
- Akhiri dengan ajakan (CTA) untuk mencoba SevnQuest.`;
}
let cat="Semua",all=[];
G.forEach(c=>c.i.forEach(f=>all.push({...f,g:c.g})));
function tabs(){
  $('#tabs').innerHTML=["Semua",...G.map(c=>c.g)].map(t=>`<button class="${t===cat?'on':''}" data-t="${t}">${t}</button>`).join("");
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.t;tabs();render()});
}
function render(){
  const q=$('#q').value.toLowerCase().trim();let n=0,h="";
  G.forEach(c=>{
    if(cat!=="Semua"&&cat!==c.g)return;
    const its=c.i.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q)||c.g.toLowerCase().includes(q));
    if(!its.length)return;n+=its.length;
    h+=`<h2>${c.g}</h2><p class="gdesc">${c.d}</p>`;
    its.forEach(f=>{const id=all.indexOf(all.find(a=>a.n===f.n));
      h+=`<div class="card"><h3>${f.n} ${st(f.st||(/Parsial/.test(f.d)?'P':''))}</h3>
<dl><dt>Lokasi</dt><dd>${f.w.join(" → ")}</dd><dt>Fungsi</dt><dd>${f.f}</dd>
<dt>Cara pakai</dt><dd><ol>${f.s.map(x=>`<li>${x}</li>`).join("")}</ol></dd>
<dt>Detail</dt><dd>${f.d}</dd></dl>
<button class="btn" data-i="${id}">Buat Konten</button><button class="btn ghost" data-p="${id}">Lihat prompt</button>
<details id="pv${id}"><summary>Pratinjau prompt</summary><pre></pre></details></div>`;});
  });
  $('#list').innerHTML=h||'<p class="sub">Tidak ada fitur yang cocok.</p>';
  $('#cnt').textContent=n+" fitur";
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{
    const f=all[b.dataset.i],t=prompt(f,f.g);
    try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
    const o=b.textContent;b.textContent="✓ Prompt tersalin";b.classList.add('ok');
    setTimeout(()=>{b.textContent=o;b.classList.remove('ok')},1800);
  });
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    const f=all[b.dataset.p],d=$('#pv'+b.dataset.p);d.querySelector('pre').textContent=prompt(f,f.g);d.open=!d.open;
  });
}
$('#q').oninput=render;
tabs();render();
</script>
</body>
</html>
