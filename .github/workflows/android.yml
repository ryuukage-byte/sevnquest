name: Android

# Membangun APK SevnQuest Notifier (android/). Terpisah dari CI web (ci.yml).
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Logika murni diuji lebih dulu tanpa menyentuh plugin Android, supaya kegagalannya jelas.
      - name: Test :core
        run: ./gradlew -PcoreOnly=true :core:test

      # Runner GitHub sudah punya Android SDK (ANDROID_HOME). Lisensi diterima supaya AGP boleh
      # mengunduh sendiri platform / build-tools yang belum terpasang.
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK debug
        run: ./gradlew -PcoreOnly=false :app:assembleDebug

      - name: Siapkan APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/sevnquest-notifier.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sevnquest-notifier-apk
          path: ${{ runner.temp }}/sevnquest-notifier.apk
          if-no-files-found: error

      - name: Unggah laporan test bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: android/core/build/reports/tests/test
          if-no-files-found: ignore
